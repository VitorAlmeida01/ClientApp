<div class="flex justify-center items-center h-[calc(100vh-128px)]">
    <div class="flex flex-col items-center gap-14">
        <h1 class="text-4xl">Seja bem-vindo</h1>

        <mat-card class="example-card " appearance="outlined">
            <mat-card-header>
                <div mat-card-avatar class="example-header-image"></div>
                <mat-card-title>Login</mat-card-title>
            </mat-card-header>
            <mat-card-content class="flex flex-col space-y-4">
                <div class="example-form">
                    <mat-form-field class="example-full-width">
                        <mat-label>E-mail</mat-label>
                        <input matInput placeholder="joao@email.com" [(ngModel)]="email">
                    </mat-form-field>

                    <mat-form-field class="example-full-width">
                        <mat-label>Senha</mat-label>
                        <input matInput type="password" placeholder="***" [(ngModel)]="senha">
                    </mat-form-field>

                    @if (mensagemErro) {
                        <p class="erro-login">{{ mensagemErro }}</p>
                    }
                </div>
            </mat-card-content>
            <mat-card-actions>
                    <button mat-raised-button color="primary" (click)="onLogin()">Logar</button>
            </mat-card-actions>
        </mat-card>
    </div>


</div>
