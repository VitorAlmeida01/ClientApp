<article class="grid gap-5 rounded-[20px] border border-slate-200 bg-[radial-gradient(circle_at_95%_5%,_rgba(34,211,238,0.2),_transparent_42%),_linear-gradient(170deg,_#ffffff_0%,_#f8fafc_100%)] p-5 shadow-[0_18px_40px_rgba(15,23,42,0.15)]">
    <header class="flex items-center gap-4">
        <div class="grid h-[52px] w-[52px] place-items-center rounded-full bg-[linear-gradient(145deg,_#1d4ed8_0%,_#0891b2_100%)] text-[1.1rem] font-extrabold text-slate-50 shadow-[0_10px_20px_rgba(29,78,216,0.34)]">{{ (nome || 'U').charAt(0).toUpperCase() }}</div>
        <div>
            <p class="m-0 text-xs uppercase tracking-[0.08em] text-slate-500">Conta ativa</p>
            <h3 class="mt-1 text-[1.2rem] font-extrabold text-slate-900">Informacoes do usuario</h3>
        </div>
    </header>

    <div class="grid gap-4">
        <div class="grid gap-1 rounded-xl bg-slate-100/80 p-4">
            <span class="text-[0.78rem] uppercase tracking-[0.08em] text-slate-500">Nome</span>
            <strong class="break-words text-base leading-[1.35] text-slate-900">{{ nome || 'Usuario' }}</strong>
        </div>

        <div class="grid gap-1 rounded-xl bg-slate-100/80 p-4">
            <span class="text-[0.78rem] uppercase tracking-[0.08em] text-slate-500">Email</span>
            <strong class="break-words text-base leading-[1.35] text-slate-900">{{ email || 'email@nao-informado.com' }}</strong>
        </div>
    </div>

    <footer class="flex flex-wrap gap-2">
        <span class="rounded-full bg-sky-200 px-2.5 py-1.5 text-xs font-semibold text-slate-900">Seguranca JWT</span>
        <span class="rounded-full bg-slate-200 px-2.5 py-1.5 text-xs font-semibold text-slate-700">Dados sincronizados</span>
    </footer>
</article>
